name: Build & Release

env:
  DEBUG: napi:*
  APP_NAME: frontend-tk-binding
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
  # 全部包发布到公共 npmjs。@aptx-js 是免费组织计划下的 scoped public 包。
  NPM_REGISTRY: https://registry.npmjs.org/

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm run build --target x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm run build --target x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm run build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm run build --target x86_64-unknown-linux-musl -x
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm run build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: pnpm run build --target armv7-unknown-linux-gnueabihf --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: pnpm run build --target aarch64-unknown-linux-musl -x
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm run build --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            build: pnpm run build --target armv7-unknown-linux-musleabihf -x

    name: stable - ${{ matrix.settings.target }} - node@20
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - uses: mlugg/setup-zig@v1
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install dependencies
        working-directory: crates/node_binding
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: crates/node_binding
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            crates/node_binding/frontend-tk-binding.*.node
          if-no-files-found: error

  release:
    name: Publish bindings
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        working-directory: crates/node_binding
        run: pnpm install --frozen-lockfile

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 把 9 个平台的 .node 收进 npm/<target>/ 和根目录。
      # 这一步必须在校验之前，校验读的就是它写出来的布局。
      - name: Collect artifacts into npm packages
        working-directory: crates/node_binding
        run: |
          mkdir -p /tmp/napi-artifacts
          for dir in ../../artifacts/bindings-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/*.node /tmp/napi-artifacts/ 2>/dev/null || true
          done
          echo "collected:"
          ls -la /tmp/napi-artifacts/
          npx napi artifacts --output-dir /tmp/napi-artifacts

      # 闸门：9 个平台少一个、版本不一致、或有陈旧 optionalDependencies，
      # 都在这里硬失败，避免 napi prepublish 的"只警告不报错"漏过残缺发布。
      - name: Verify all platform artifacts
        working-directory: crates/node_binding
        run: node ../../scripts/verify-artifacts.mjs --verbose

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.node
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 版本同步 + optionalDependencies 回写 + 9 个平台包发布，一步到位。
      # 根包最后发，因为客户端一旦能解析到根包就会立刻去拉所有平台包。
      - name: Publish platform packages and root package
        working-directory: crates/node_binding
        run: node ../../scripts/publish-binding.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY: ${{ env.NPM_REGISTRY }}
