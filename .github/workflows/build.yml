name: CI

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 全部包发布到公共 npmjs。@aptx-js 是免费组织计划下的 scoped public 包。
  NPM_REGISTRY: https://registry.npmjs.org/

jobs:
  publish:
    name: Publish TypeScript Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 平台包 @aptx-js/frontend-tk-binding-* 由 release.yml 在同一个 tag 上发布。
      # 它必须在任何依赖 binding 的包之前完成，否则会发出指向不存在版本的包。
      - name: Wait for platform bindings
        run: |
          set -uo pipefail
          version=$(node -p "require('./crates/node_binding/package.json').version")
          echo "==> Waiting for @aptx-js/frontend-tk-binding@${version}"
          for i in $(seq 1 60); do
            if pnpm view "@aptx-js/frontend-tk-binding@${version}" version --registry="${NPM_REGISTRY}" >/dev/null 2>&1; then
              echo "OK: binding ${version} is published"
              exit 0
            fi
            echo "  attempt ${i}/60: not yet, retrying in 20s"
            sleep 20
          done
          echo "ERROR: @aptx-js/frontend-tk-binding@${version} was not published within 20 minutes."
          echo "The binding is published by release.yml. Check that its build matrix succeeded."
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm -r --filter './packages/*' run build

      - name: Publish workspace packages
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            echo "==> ${name}@${version}"
            if pnpm view "${name}@${version}" --registry="${NPM_REGISTRY}" version >/dev/null 2>&1; then
              echo "SKIP: already exists: ${name}@${version}"
            # scoped public 包必须显式 --access public，否则默认按 private 处理会被拒。
            elif pnpm publish --dir "${dir}" --access public --ignore-scripts --no-git-checks --registry="${NPM_REGISTRY}"; then
              echo "PUBLISHED: ${name}@${version}"
            else
              echo "FAILED: ${name}@${version}"
              failed=1
            fi
          done
          exit "${failed}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
